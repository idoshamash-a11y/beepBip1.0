name: beepbip
description: A location-based social discovery mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase & Authentication
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^6.0.4

  # State Management
  flutter_riverpod: ^2.5.1

  # Maps
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # UI & Navigation
  go_router: ^13.2.0
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  permission_handler: ^11.3.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
